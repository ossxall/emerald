services:
  document-transform-worker:
    image: emerald/document-transform-worker:python-3.11.18-opendataloader-2.5.16
    pull_policy: build
    build:
      context: ./bin/worker
      dockerfile: Dockerfile
    container_name: document_transform_worker
    env_file:
      - ./bin/worker/.env
    networks:
      - shared-network
  document-transform-tiptap:
    build:
      context: ./bin/tiptap
      dockerfile: Dockerfile
    container_name: document_transform_tiptap 
    env_file:
      - ./bin/tiptap/.env
    ports:
      - "7001:7001"      
    networks:
      - shared-network 
  document-transform-publisher:
    build:
      context: ./bin/publisher
      dockerfile: Dockerfile
    container_name: document_transform_publisher
    env_file:
      - ./bin/publisher/.env
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: emerald-infra-net
