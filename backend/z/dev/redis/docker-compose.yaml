services:
  emerald-redis:
    image: redis:7.2-alpine
    container_name: emerald-redis
    ports:
      - "16380:6379"
    volumes:
      - emerald_redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy noeviction
    restart: always
    networks:
      - shared-network

volumes:
  emerald_redis_data:

networks:
  shared-network:
    external: true
    name: emerald-infra-net