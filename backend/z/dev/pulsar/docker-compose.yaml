services:
  # Start zookeeper
  emerald-zookeeper:
    image: apachepulsar/pulsar:latest
    container_name: emerald-zookeeper
    restart: on-failure
    networks:
      - pulsar-internal
    volumes:
      - ./data/zookeeper:/pulsar/data/zookeeper
    environment:
      - metadataStoreUrl=zk:emerald-zookeeper:2181
      - PULSAR_MEM=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env.py conf/zookeeper.conf && \
        bin/generate-zookeeper-config.sh conf/zookeeper.conf && \
        exec bin/pulsar zookeeper
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Init cluster metadata
  emerald-pulsar-init:
    container_name: emerald-pulsar-init
    hostname: emerald-pulsar-init
    image: apachepulsar/pulsar:latest
    networks:
      - pulsar-internal
    command:
      - bash
      - -c
      - |
        bin/pulsar initialize-cluster-metadata \
        --cluster cluster-a \
        --zookeeper emerald-zookeeper:2181 \
        --configuration-store emerald-zookeeper:2181 \
        --web-service-url http://emerald-broker:8080 \
        --broker-service-url pulsar://emerald-broker:6650
    depends_on:
      emerald-zookeeper:
        condition: service_healthy

  # Start bookie
  emerald-bookie:
    image: apachepulsar/pulsar:latest
    container_name: emerald-bookie
    restart: on-failure
    networks:
      - pulsar-internal
    environment:
      - clusterName=cluster-a
      - zkServers=emerald-zookeeper:2181
      - metadataServiceUri=metadata-store:zk:emerald-zookeeper:2181
      # otherwise every time we run docker compose up or down we fail to start due to Cookie
      # See: https://github.com/apache/bookkeeper/blob/405e72acf42bb1104296447ea8840d805094c787/bookkeeper-server/src/main/java/org/apache/bookkeeper/bookie/Cookie.java#L57-68
      - advertisedAddress=emerald-bookie
      - BOOKIE_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      emerald-zookeeper:
        condition: service_healthy
      emerald-pulsar-init:
        condition: service_completed_successfully
    # Map the local directory to the container to avoid bookie startup failure due to insufficient container disks.
    volumes:
      - ./data/bookkeeper:/pulsar/data/bookkeeper
    command: bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"

  # Start broker
  emerald-broker:
    image: apachepulsar/pulsar:latest
    container_name: emerald-broker
    hostname: emerald-broker
    restart: on-failure
    networks:
      - pulsar-internal
      - shared-network
    environment:
      - metadataStoreUrl=zk:emerald-zookeeper:2181
      - zookeeperServers=emerald-zookeeper:2181
      - clusterName=cluster-a
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - advertisedAddress=emerald-broker
      - advertisedListeners=internal:pulsar://emerald-broker:6650,external:pulsar://localhost:17650
      - internalListenerName=internal
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      emerald-zookeeper:
        condition: service_healthy
      emerald-bookie:
        condition: service_started
    ports:
      - "17650:6650"
      - "17080:8080"
    command: bash -c "bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker"

networks:
  pulsar-internal:
    driver: bridge
  shared-network:
    external: true
    name: emerald-infra-net