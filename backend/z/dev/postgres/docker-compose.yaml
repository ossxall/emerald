services:
  emerald-postgres:
    image: postgres:17-alpine
    container_name: emerald-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=main_db

      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
    ports:
      - "15432:5432"
    volumes:
      - emerald_postgres_data:/var/lib/postgresql/data

      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 1gb

volumes:
  emerald_postgres_data:
    driver: local

networks:
  shared-network:
    external: true
    name: emerald-infra-net